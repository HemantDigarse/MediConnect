spring:
  application:
    name: mediconnect-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mediconnect}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your@gmail.com}
    password: ${MAIL_PASSWORD:yourapppassword}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

  cache:
    type: redis
    redis:
      time-to-live: 600000

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mediconnect-super-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256}
  expiry-ms: ${JWT_EXPIRY_MS:900000}         # 15 minutes
  refresh-expiry-ms: 604800000              # 7 days

# AWS S3
aws:
  access-key: ${AWS_ACCESS_KEY:your-access-key}
  secret-key: ${AWS_SECRET_KEY:your-secret-key}
  s3:
    bucket: ${AWS_S3_BUCKET:mediconnect-files}
    region: ${AWS_REGION:ap-south-1}

# Razorpay
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}

# Twilio
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:AC_placeholder}
  auth-token: ${TWILIO_AUTH_TOKEN:placeholder_token}
  phone-number: ${TWILIO_PHONE:+1234567890}
  enabled: ${TWILIO_ENABLED:false}

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: MediConnect API
    description: Telemedicine Platform REST API
    version: 1.0.0

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# App
app:
  base-url: ${APP_BASE_URL:http://localhost:5173}

# Logging
logging:
  level:
    com.mediconnect: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
